server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape logs from all Docker containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.stack.namespace"]
    
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      
      # Extract container ID (short)
      - source_labels: ['__meta_docker_container_id']
        regex: '([a-z0-9]{12}).*'
        target_label: 'container_id'
      
      # Extract container image
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'
      
      # Extract stack name (Docker Swarm)
      - source_labels: ['__meta_docker_container_label_com_docker_stack_namespace']
        target_label: 'stack'
      
      # Extract service name (Docker Swarm)
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_service_name']
        target_label: 'service'
      
      # Extract task ID (Docker Swarm)
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_task_id']
        regex: '([a-z0-9]{12}).*'
        target_label: 'task_id'
      
      # Extract node ID
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_node_id']
        target_label: 'node_id'
      
      # Determine environment from stack name
      - source_labels: ['stack']
        regex: 'ssgg-be-v2-production'
        target_label: 'environment'
        replacement: 'production'
      
      - source_labels: ['stack']
        regex: 'ssgg-be-v2-staging'
        target_label: 'environment'
        replacement: 'staging'
      
      - source_labels: ['stack']
        regex: 'ssgg-monitoring'
        target_label: 'environment'
        replacement: 'monitoring'
      
      - source_labels: ['stack']
        regex: 'traefik'
        target_label: 'environment'
        replacement: 'gateway'
      
      # Only scrape containers from our stacks
      - source_labels: ['stack']
        regex: '(ssgg-be-v2-production|ssgg-be-v2-staging|ssgg-monitoring|traefik)'
        action: keep

    # Parse logs from StandardFormatter (plain text Python logs)
    pipeline_stages:
      # Parse standard Python log format: "2026-03-18 10:30:45 - logger_name - LEVEL - message [extras]"
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) - (?P<logger>\S+) - (?P<level>\w+) - (?P<message>.*?)(?:\s+\[(?P<extras>.*?)\])?$'
      
      # Parse the extras section if present (e.g., "request_id=abc, method=GET, url=/api/users")
      - regex:
          source: extras
          expression: 'request_id=(?P<request_id>[a-f0-9-]+)'
      
      - regex:
          source: extras
          expression: 'method=(?P<method>\w+)'
      
      - regex:
          source: extras
          expression: 'url=(?P<url>[^\s,]+)'
      
      - regex:
          source: extras
          expression: 'status=(?P<status_code>\d+)'
      
      - regex:
          source: extras
          expression: 'time=(?P<duration_s>[\d.]+)s'
      
      - regex:
          source: extras
          expression: 'ip=(?P<client_ip>[^\s,]+)'
      
      # Parse timestamp from log line
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
      
      # Extract ONLY low-cardinality fields as labels
      # High-cardinality fields (request_id, url, client_ip) remain as indexed fields
      - labels:
          level:
          logger:
          request_id:
          method:
          status_code:
          url:
          environment:
          stack:
          service:
      
      # Add static labels for this application
      - static_labels:
          app: ssgg-api
          job: ssgg-api

