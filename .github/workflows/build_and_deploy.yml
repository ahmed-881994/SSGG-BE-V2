name: Build and Deploy

on:
  push:
    branches:
      - 'release/**'  # Staging environment
      - 'hotfix/**'   # Hotfix staging validation
      - main          # Build only, no deploy
      - 'feature/**'  # Build only for CI checks
    tags:
      - 'v*'          # Production deployment on tag creation
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Manual trigger
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version tag (for production manual deploy)'
        required: false
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      should-deploy: ${{ steps.set-env.outputs.should-deploy }}
      image-tag: ${{ steps.set-env.outputs.image-tag }}
      version: ${{ steps.set-version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version detection
      
      - name: Read VERSION file
        id: set-version
        run: |
          VERSION=$(cat VERSION)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION}"
      
      - name: Determine environment from branch/tag
        id: set-env
        run: |
          # Check if this is a tag push
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Tag creation triggers production deployment
            TAG_NAME=${GITHUB_REF#refs/tags/}
            ENVIRONMENT="production"
            SHOULD_DEPLOY="true"
            IMAGE_TAG="${TAG_NAME}"
            echo "🏷️  Tag detected: ${TAG_NAME} → Production deployment"
          else
            # Branch push
            BRANCH=${GITHUB_REF#refs/heads/}
            echo "Branch: ${BRANCH}"
            
            if [[ "${BRANCH}" =~ ^release/.+ ]]; then
              # Release branch → staging deployment
              ENVIRONMENT="staging"
              SHOULD_DEPLOY="true"
              IMAGE_TAG="v${{ steps.set-version.outputs.version }}-rc"
            elif [[ "${BRANCH}" =~ ^hotfix/.+ ]]; then
              # Hotfix branch → staging deployment
              ENVIRONMENT="staging"
              SHOULD_DEPLOY="true"
              IMAGE_TAG="v${{ steps.set-version.outputs.version }}-hotfix"
            else
              # Main, feature branches → build only, no deployment
              ENVIRONMENT="none"
              SHOULD_DEPLOY="false"
              IMAGE_TAG="v${{ steps.set-version.outputs.version }}-${GITHUB_SHA:0:7}"
            fi
          fi
          
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "should-deploy=${SHOULD_DEPLOY}" >> $GITHUB_OUTPUT
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          
          echo "🎯 Environment: ${ENVIRONMENT}"
          echo "🚀 Should Deploy: ${SHOULD_DEPLOY}"
          echo "🏷️  Image Tag: ${IMAGE_TAG}"

  build:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    needs: setup
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}
      
      - name: Build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ssgg-be-v2
          tags: |
            # Semantic version tag
            type=raw,value=${{ needs.setup.outputs.image-tag }}
            # Latest tag for main branch only
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Environment-specific latest (for tracking)
            type=raw,value=${{ needs.setup.outputs.environment }}-latest,enable=${{ needs.setup.outputs.should-deploy == 'true' }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.setup.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Image digest
        run: |
          echo "📦 Image built and pushed successfully"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
    
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-24.04
    needs: [setup, build]
    if: needs.setup.outputs.environment == 'staging' && needs.setup.outputs.should-deploy == 'true'
    environment:
      name: staging
      url: https://api.stg.sportingscout.org
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create environment file
        run: |
          cat > .env << EOF
          environment=${{ needs.setup.outputs.environment }}
          # DB settings
          db_host=${{ secrets.DB_HOST }}
          db_port=${{ secrets.DB_PORT }}
          db_database=${{ secrets.DB_NAME }}
          db_username=${{ secrets.DB_USER }}
          db_password=${{ secrets.DB_PASSWORD }}

          # Database connection pool settings
          db_max_connections=${{ secrets.DB_MAX_CONNECTIONS }}
          db_min_connections=${{ secrets.DB_MIN_CONNECTIONS }}

          # Redis
          rds_host=${{ secrets.REDIS_HOST }}
          rds_port=${{ secrets.REDIS_PORT }}
          rds_database=${{ secrets.REDIS_DATABASE }}

          # JWT settings
          secret_key=${{ secrets.JWT_SECRET }}
          algorithm=${{ secrets.JWT_ALGORITHM }}
          access_token_expires_minutes=${{ vars.JWT_EXPIRES_IN }}

          # Security settings
          cors_origins="*"
          rate_limit_per_minute=${{ vars.RATE_LIMIT_PER_MINUTE }}

          # Logging settings
          log_level=${{ vars.LOG_LEVEL }}

          # # OpenTelemetry settings
          # otel_exporter_otlp_endpoint=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          # otel_service_name=${{ vars.OTEL_SERVICE_NAME }}
          # otel_log_correlation=${{ vars.OTEL_LOG_CORRELATION }}

          # Email settings
          smtp_server=${{ secrets.SMTP_SERVER }}
          smtp_port=${{ secrets.SMTP_PORT }}
          smtp_username=${{ secrets.SMTP_USERNAME }}
          smtp_password=${{ secrets.SMTP_PASSWORD }}
          from_email=${{ secrets.SMTP_USERNAME }}

          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.DB_NAME }}
          MYSQL_USER=${{ secrets.DB_USER }}
          MYSQL_PASSWORD=${{ secrets.DB_PASSWORD }}        

          # Docker Compose settings
          IMAGE_TAG=${{ needs.setup.outputs.image-tag }}
          EOF
      
      - name: Deploy to Staging Swarm
        uses: cssnr/stack-deploy-action@v1
        with:
          name: ssgg-be-v2-staging
          file: docker/docker-stack.staging.yml
          mode: swarm
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
          registry_host: "ghcr.io"
          registry_user: ${{ github.repository_owner }}
          registry_pass: ${{ secrets.GH_TOKEN }}
          env_file: ./.env
          registry_auth: true
          summary: true
      
      - name: Health check
        run: |
          sleep 15
          curl -f https://api.stg.sportingscout.org/health || exit 1
          echo "✅ Staging deployment successful"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    needs: [setup, build]
    if: needs.setup.outputs.environment == 'production' && needs.setup.outputs.should-deploy == 'true'
    environment:
      name: production
      url: https://api.sportingscout.org
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create git tag
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=v${{ needs.setup.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${VERSION} -m "Release ${VERSION}"
          git push origin ${VERSION}
      
      - name: Create environment file
        run: |
          cat > .env << EOF
          environment=${{ needs.setup.outputs.environment }}
          # DB settings
          db_host=${{ secrets.DB_HOST }}
          db_port=${{ secrets.DB_PORT }}
          db_database=${{ secrets.DB_NAME }}
          db_username=${{ secrets.DB_USER }}
          db_password=${{ secrets.DB_PASSWORD }}

          # Database connection pool settings
          db_max_connections=${{ secrets.DB_MAX_CONNECTIONS }}
          db_min_connections=${{ secrets.DB_MIN_CONNECTIONS }}

          # Redis
          rds_host=${{ secrets.REDIS_HOST }}
          rds_port=${{ secrets.REDIS_PORT }}
          rds_database=${{ secrets.REDIS_DATABASE }}

          # JWT settings
          secret_key=${{ secrets.JWT_SECRET }}
          algorithm=${{ secrets.JWT_ALGORITHM }}
          access_token_expires_minutes=${{ vars.JWT_EXPIRES_IN }}

          # Security settings
          cors_origins="*"
          rate_limit_per_minute=${{ vars.RATE_LIMIT_PER_MINUTE }}

          # Logging settings
          log_level=${{ vars.LOG_LEVEL }}

          # # OpenTelemetry settings
          # otel_exporter_otlp_endpoint=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          # otel_service_name=${{ vars.OTEL_SERVICE_NAME }}
          # otel_log_correlation=${{ vars.OTEL_LOG_CORRELATION }}

          # Email settings
          smtp_server=${{ secrets.SMTP_SERVER }}
          smtp_port=${{ secrets.SMTP_PORT }}
          smtp_username=${{ secrets.SMTP_USERNAME }}
          smtp_password=${{ secrets.SMTP_PASSWORD }}
          from_email=${{ secrets.SMTP_USERNAME }}


          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.DB_NAME }}
          MYSQL_USER=${{ secrets.DB_USER }}
          MYSQL_PASSWORD=${{ secrets.DB_PASSWORD }}        

          # Docker Compose settings
          IMAGE_TAG=${{ needs.setup.outputs.image-tag }}
          EOF
      
      - name: Deploy to Production Swarm
        uses: cssnr/stack-deploy-action@v1
        with:
          name: ssgg-be-v2-production
          file: docker/docker-stack.production.yml
          mode: swarm
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
          registry_host: "ghcr.io"
          registry_user: ${{ github.repository_owner }}
          registry_pass: ${{ secrets.GH_TOKEN }}
          env_file: ./.env
          registry_auth: true
          summary: true
      
      - name: Health check
        run: |
          sleep 20
          curl -f https://api.sportingscout.org/health || exit 1
          echo "✅ Production deployment successful"
      
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          name: Release v${{ needs.setup.outputs.version }}
          body: |
            ## Release v${{ needs.setup.outputs.version }}
            
            **Deployed:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
            
            ### Changes
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}