name: Deploy to Staging

on:
  push:
    branches: [stage]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ENVIRONMENT: staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: stage

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: https://ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GH_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./dockerfile
        push: true
        tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ssgg-be-v2:${{ env.ENVIRONMENT }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ssgg-be-v2:${{ env.ENVIRONMENT }}-latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: stage

    - name: Docker Stack Deploy Traefik
      uses: cssnr/stack-deploy-action@v1
      with:
        name: traefik
        file: docker-stack-traefik.yml
        mode: swarm
        host: ${{ secrets.SSH_HOST }}
        user: ${{ secrets.SSH_USER }}
        ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
        summary: true

    - name: Create environment file
      run: |
        cat > .env << EOF
        # Application environment
        environment=${{ env.ENVIRONMENT }}
        # DB settings
        db_host=${{ secrets.STAGING_DB_HOST }}
        db_port=${{ secrets.STAGING_DB_PORT }}
        db_database=${{ secrets.STAGING_DB_NAME }}
        db_username=${{ secrets.STAGING_DB_USER }}
        db_password=${{ secrets.STAGING_DB_PASSWORD }}


        # Database connection pool settings
        db_max_connections=${{ secrets.STAGING_DB_MAX_CONNECTIONS }}
        db_min_connections=${{ secrets.STAGING_DB_MIN_CONNECTIONS }}

        # Redis
        rds_host=${{ secrets.STAGING_REDIS_HOST }}
        rds_port=${{ secrets.STAGING_REDIS_PORT }}
        rds_database=${{ secrets.STAGING_REDIS_DATABASE }}

        # JWT settings
        secret_key=${{ secrets.STAGING_JWT_SECRET }}
        algorithm=${{ secrets.STAGING_JWT_ALGORITHM }}
        access_token_expires_minutes=${{ secrets.STAGING_JWT_EXPIRES_IN }}


        # Security settings
        cors_origins="*"
        rate_limit_per_minute=${{ secrets.STAGING_RATE_LIMIT_PER_MINUTE }}


        # Logging settings
        log_level=${{ secrets.STAGING_LOG_LEVEL }}

        # Email settings
        smtp_server=${{ secrets.SMTP_SERVER }}
        smtp_port=${{ secrets.SMTP_PORT }}
        smtp_username=${{ secrets.SMTP_USERNAME }}
        smtp_password=${{ secrets.SMTP_PASSWORD }}
        from_email=${{ secrets.SMTP_USERNAME }}


        MYSQL_ROOT_PASSWORD=${{ secrets.STAGING_MYSQL_ROOT_PASSWORD }}
        MYSQL_DATABASE=${{ secrets.STAGING_DB_NAME }}
        MYSQL_USER=${{ secrets.STAGING_DB_USER }}
        MYSQL_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}        
        
        # Docker Compose settings
        GIT_COMMIT_HASH=${{ github.sha }}
        EOF

    - name: Debug Environment File
      run: |
        echo "=== Generated .env file ==="
        cat .env
        echo "=== Environment variable check ==="
        grep "environment=" .env || echo "ERROR: environment variable missing!"
      
    - name: Docker Stack Deploy
      uses: cssnr/stack-deploy-action@v1
      with:
        name: ssgg-be-v2-staging
        file: docker-stack.stg.yml
        mode: swarm
        host: ${{ secrets.SSH_HOST }}
        user: ${{ secrets.SSH_USER }}
        ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
        registry_host: 'ghcr.io'
        registry_user: ${{ github.repository_owner }}
        registry_pass: ${{ secrets.GH_TOKEN }}
        env_file: ./.env
        registry_auth: true
        summary: true

    - name: Ensure monitoring networks exist
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "📡 Ensuring monitoring networks exist..."
          # Create stg-internal network if it doesn't exist
          if ! docker network ls | grep -q "stg-internal"; then
            echo "Creating stg-internal network..."
            docker network create --driver overlay stg-internal
          else
            echo "✅ stg-internal network exists"
          fi
          # Create prd-internal network if it doesn't exist
          if ! docker network ls | grep -q "prd-internal"; then
            echo "Creating prd-internal network..."
            docker network create --driver overlay prd-internal
          else
            echo "✅ prd-internal network exists"
          fi

    - name: Check if Monitoring stack is already deployed
      id: check-monitoring
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          if docker stack ls | grep -q "^ssgg-monitoring"; then
            echo "MONITORING_EXISTS=true" >> $GITHUB_OUTPUT
            echo "✅ Monitoring stack already deployed"
          else
            echo "MONITORING_EXISTS=false" >> $GITHUB_OUTPUT
            echo "⚠️  Monitoring stack not found - will deploy"
          fi

    - name: Docker Stack Deploy Monitoring
      if: steps.check-monitoring.outputs.MONITORING_EXISTS != 'true'
      uses: cssnr/stack-deploy-action@v1
      with:
        name: ssgg-monitoring
        file: docker-stack-monitoring.yml
        mode: swarm
        host: ${{ secrets.SSH_HOST }}
        user: ${{ secrets.SSH_USER }}
        ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
        summary: true

    - name: Skip Monitoring deployment
      if: steps.check-monitoring.outputs.MONITORING_EXISTS == 'true'
      run: |
        echo "=========================================="
        echo "⏭️  Skipping Monitoring deployment"
        echo "Monitoring stack is already running"
        echo "=========================================="

    - name: Cleanup
      if: always()
      run: rm -f .env
  health-check:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
    - name: Health Check
      run: |
        echo "Waiting for the application to start..."
        sleep 60

        HEALTH_URL="https://${{ secrets.STAGING_DOMAIN }}/health"

        echo "Testing: $HEALTH_URL"
        for i in {1..5}; do
          if curl -f -m 10 "$HEALTH_URL" 2>/dev/null; then
            echo "✅ Staging deployment successful!"
            exit 0
          fi
          sleep 15
        done

        echo "❌ Staging health check failed"
        exit 1