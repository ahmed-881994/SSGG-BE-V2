      - name: Ensure Loki Docker plugin is installed and enabled
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            if ! docker plugin inspect loki > /dev/null 2>&1; then
              ARCH=$(uname -m)
              if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                PLUGIN_IMAGE="grafana/loki-docker-driver:3.6.0-arm64"
              else
                PLUGIN_IMAGE="grafana/loki-docker-driver:3.6.0-amd64"
