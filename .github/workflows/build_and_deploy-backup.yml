  health-check:
    needs: 
      - setup
      - deploy
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Health Check
        run: |
          echo "Waiting for the application to start..."
          sleep 60

          HEALTH_URL="https://${{ secrets.DOMAIN }}/health"

          echo "Testing: $HEALTH_URL"
          for i in {1..5}; do
            if curl -f -m 10 "$HEALTH_URL" 2>/dev/null; then
              echo "✅ ${{ needs.setup.outputs.environment }} deployment successful!"
              exit 0
            fi
            sleep 15
          done

          echo "❌ ${{ needs.setup.outputs.environment }} health check failed"
          exit 1
