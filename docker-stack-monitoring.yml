version: '3.9'

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus_yml
        target: /etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - traefik-public
      - stg-internal
      - prd-internal
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.rule=Host(`prometheus.sportingscout.org`)"
        - "traefik.http.routers.prometheus.entrypoints=websecure"
        - "traefik.http.routers.prometheus.tls=true"
        - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
        - "traefik.docker.network=traefik-public"
        # Add basic auth for security
        - "traefik.http.routers.prometheus.middlewares=prometheus-auth"
        - "traefik.http.middlewares.prometheus-auth.basicauth.users=admin:$$apr1$$KZ9sWrDc$$0J1yO/63mY6bdqAxmAj.q0"
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/default.yml
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.sportingscout.org
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - traefik-public
      - stg-internal
      - prd-internal
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`grafana.sportingscout.org`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls=true"
        - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        - "traefik.docker.network=traefik-public"
      restart_policy:
        condition: on-failure

  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - traefik-public
      - stg-internal
      - prd-internal
    deploy:
      mode: global  # Run on every node
      restart_policy:
        condition: on-failure

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    configs:
      - source: loki_config
        target: /etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - traefik-public
      - stg-internal
      - prd-internal
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.loki.rule=Host(`loki.sportingscout.org`)"
        - "traefik.http.routers.loki.entrypoints=websecure"
        - "traefik.http.routers.loki.tls=true"
        - "traefik.http.routers.loki.tls.certresolver=letsencrypt"
        - "traefik.http.services.loki.loadbalancer.server.port=3100"
        - "traefik.docker.network=traefik-public"
        - "traefik.http.routers.loki.middlewares=loki-auth"
        - "traefik.http.middlewares.loki-auth.basicauth.users=admin:$$apr1$$KZ9sWrDc$$0J1yO/63mY6bdqAxmAj.q0"
      restart_policy:
        condition: on-failure

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - traefik-public
      - stg-internal
      - prd-internal
    deploy:
      mode: global  # Run on every node to collect all container logs
      restart_policy:
        condition: on-failure

configs:
  prometheus_yml:
    file: ./prometheus.yml
  loki_config:
    file: ./loki-config.yml
  promtail_config:
    file: ./promtail-config.yml
  grafana_datasources:
    file: ./grafana/provisioning/datasources/prometheus.yml
  grafana_dashboards:
    file: ./grafana/provisioning/dashboards/default.yml

networks:
  traefik-public:
    external: true
  stg-internal:
    driver: overlay
  prd-internal:
    driver: overlay

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
