version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  #------ mysql ------
  mysql:
    image: mysql:lts
    ports:
      - "127.0.0.1:3316:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s                 # Let the app boot before first check
    networks:
      - stg-internal
    deploy:
      restart_policy:
        condition: any
    logging: *default-logging

  #------ api ------
  api:
    image: ghcr.io/ahmed-881994/ssgg-be-v2:${IMAGE_TAG}
    # ports:
    #   - "8001:8000"
    environment:
      - environment=${environment}
      - db_host=${db_host}
      - db_port=${db_port}
      - db_database=${db_database}
      - db_username=${db_username}
      - db_password=${db_password}
      - db_pool_size=${db_pool_size}
      - db_pool_max_overflow=${db_pool_max_overflow}
      - db_pool_timeout_seconds=${db_pool_timeout_seconds}
      - db_pool_recycle_seconds=${db_pool_recycle_seconds}
      - rds_host=${rds_host}
      - rds_port=${rds_port}
      - rds_database=${rds_database}
      - secret_key=${secret_key}
      - algorithm=${algorithm}
      - access_token_expires_minutes=${access_token_expires_minutes}
      - cors_origins=${cors_origins}
      - rate_limit_per_minute=${rate_limit_per_minute}
      - log_level=${log_level}
      - smtp_server=${smtp_server}
      - smtp_port=${smtp_port}
      - smtp_username=${smtp_username}
      - smtp_password=${smtp_password}
      - from_email=${from_email}
      - otel_exporter_otlp_endpoint=${otel_exporter_otlp_endpoint}
      - otel_service_name=${otel_service_name}
      - otel_log_correlation=${otel_log_correlation}
    deploy:
      labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-staging.rule=Host(`api.stg.sportingscout.org`)"
      - "traefik.http.routers.api-staging.entrypoints=web,websecure"
      - "traefik.http.routers.api-staging.tls=true"
      - "traefik.http.routers.api-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-staging.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik-public"
      mode: replicated
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        order: start-first
        parallelism: 1           # only update 1 task at a time
        delay: 10s                # wait before moving to next
        failure_action: rollback # revert if update fails
    stop_grace_period: 5s              # Kill old container quickly after swap
    networks:
      - traefik-public
      - stg-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s                 # Let the app boot before first check
    logging: *default-logging

  #------ redis ------
  redis:
    image: redis:7
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s                 # Let the app boot before first check
    networks:
      - stg-internal
    deploy:
      restart_policy:
        condition: any
    logging: *default-logging

volumes:
  redis_data:
  mysql_data:
  traefik-public-certificates:

networks:
  traefik-public:
    external: true
  stg-internal:
    driver: overlay
