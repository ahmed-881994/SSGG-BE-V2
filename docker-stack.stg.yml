version: "3.9"

services:
  #------ mysql ------
  mysql:
    image: mysql:lts
    ports:
      - "3316:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - stg-internal
    deploy:
      restart_policy:
        condition: any

  #------ api ------
  api:
    image: ghcr.io/ahmed-881994/ssgg-be-v2:staging-${GIT_COMMIT_HASH}
    # ports:
    #   - "8001:8000"
    environment:
      - db_host=${db_host}
      - db_port=${db_port}
      - db_database=${db_database}
      - db_username=${db_username}
      - db_password=${db_password}
      - db_max_connections=${db_max_connections}
      - db_min_connections=${db_min_connections}
      - rds_host=redis
      - rds_port=6378
      - rds_database=${rds_database}
      - secret_key=${secret_key}
      - algorithm=${algorithm}
      - access_token_expire_minutes=${access_token_expire_minutes}
      - cors_origins=${cors_origins}
      - rate_limit_per_minute=${rate_limit_per_minute}
      - log_level=${log_level}
    deploy:
      labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.stg.sportingscout.org`)"
      - "traefik.http.routers.api.entrypoints=web,websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first
    networks:
      - traefik-public
      - stg-internal

  #------ redis ------
  redis:
    image: redis:7
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10
    networks:
      - stg-internal
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  redis_data:
  mysql_data:
  traefik-public-certificates:

networks:
  traefik-public:
    external: true
  stg-internal:
    driver: overlay
