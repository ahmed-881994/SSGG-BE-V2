version: "3.9"

services:
  #------ mysql ------
  mysql:
    image: mysql:lts
    ports:
      - "3316:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - traefik-public
    deploy:
      restart_policy:
        condition: any

  #------ traefik ------
  traefik:
    image: traefik:v3.1
    command:
      # Docker provider in Swarm
      - "--providers.swarm=true"
      # - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"

      # Entrypoints & redirect
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Let's Encrypt (HTTP challenge)
      - "--certificatesresolvers.letsencrypt.acme.email=dtc@sportingscout.org"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

      # Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # Logging
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-public-certificates:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      # Dashboard router
      - "traefik.http.routers.traefik.rule=Host(`traefik.stg.sportingscout.org`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      # Basic auth for dashboard (admin:password)
      - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$apr1$$rC6ZfPjv$$JjzQ17eR4evkhyVs2vJQe/"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
    networks:
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  #------ api ------
  api:
    image: ghcr.io/ahmed-881994/ssgg-be-v2:staging-${GIT_COMMIT_HASH}
    ports:
      - "8001:8000"
    environment:
      - environment=stg
      - db_host=${db_host}
      - db_port=${db_port}
      - db_database=${db_database}
      - db_username=${db_username}
      - db_password=${db_password}
      - db_max_connections=${db_max_connections}
      - db_min_connections=${db_min_connections}
      - rds_host=${rds_host}
      - rds_port=${rds_port}
      - rds_database=${rds_database}
      - secret_key=${secret_key}
      - algorithm=${algorithm}
      - access_token_expire_minutes=${access_token_expire_minutes}
      - cors_origins=${cors_origins}
      - rate_limit_per_minute=${rate_limit_per_minute}
      - log_level=${log_level}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web,websecure"
      - "traefik.http.routers.api.rule=Host(`api.stg.sportingscout.org`)"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first
    networks:
      - traefik-public

  #------ redis ------
  redis:
    image: redis:7
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10
    networks:
      - traefik-public
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  redis_data:
  mysql_data:
  traefik-public-certificates:

networks:
  traefik-public:
    external: true
